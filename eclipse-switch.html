<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eclipse Switch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 48px;
  transition: background 1.2s cubic-bezier(0.4,0,0.2,1), color 1.2s cubic-bezier(0.4,0,0.2,1);
}
body.light {
  background: linear-gradient(160deg, #e8f0ff 0%, #c8d8f8 50%, #b8d0ff 100%);
  color: #1a1a2e;
}
body.dark {
  background: linear-gradient(160deg, #02020a 0%, #05050f 50%, #080818 100%);
  color: rgba(255,255,255,0.85);
}

.clouds { position:fixed; inset:0; pointer-events:none; overflow:hidden; transition:opacity 1s ease; }
body.dark  .clouds { opacity:0; }
body.light .clouds { opacity:1; }

.cloud {
  position:absolute; background:rgba(255,255,255,0.7);
  border-radius:50px; filter:blur(2px);
  animation: cloudDrift linear infinite;
}
.cloud::before, .cloud::after { content:''; position:absolute; background:inherit; border-radius:50%; }
@keyframes cloudDrift { from{transform:translateX(-200px)} to{transform:translateX(calc(100vw + 200px))} }

.stars { position:fixed; inset:0; pointer-events:none; transition:opacity 1.2s ease; }
body.light .stars { opacity:0; }
body.dark  .stars { opacity:1; }
.star { position:absolute; border-radius:50%; background:#fff; animation:starTwinkle ease-in-out infinite; }
@keyframes starTwinkle { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }

.switch-label { font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:0.4; }

/* ── SWITCH TRACK ── */
.switch {
  position: relative;
  width: 140px; height: 68px; border-radius: 34px;
  cursor: grab;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 1.2s cubic-bezier(0.4,0,0.2,1), box-shadow 1.2s cubic-bezier(0.4,0,0.2,1);
  touch-action: none;
  user-select: none;
}
.switch:active { cursor: grabbing; }

body.light .switch {
  background: linear-gradient(135deg, #a8d0ff 0%, #7ab8ff 100%);
  box-shadow: 0 4px 20px rgba(100,160,255,0.4), 0 1px 0 rgba(255,255,255,0.6) inset;
}
body.dark .switch {
  background: linear-gradient(135deg, #0a0a1a 0%, #12122a 100%);
  box-shadow: 0 4px 24px rgba(0,0,40,0.6), 0 0 40px rgba(100,120,255,0.08), 0 1px 0 rgba(255,255,255,0.06) inset;
}
.switch::before {
  content:''; position:absolute; top:0; left:0; right:0;
  height:50%; border-radius:34px 34px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,0.2) 0%,transparent 100%);
  pointer-events:none;
}

/* glow */
.switch-glow {
  position:absolute; top:50%; width:54px; height:54px; border-radius:50%;
  transform:translateY(-50%); pointer-events:none;
  transition: left 1.2s cubic-bezier(0.34,1.56,0.64,1), background 1.2s ease, box-shadow 1.2s ease;
}
body.light .switch-glow { left:7px; background:rgba(255,220,80,0.25); box-shadow:0 0 30px 10px rgba(255,200,50,0.35); }
body.dark  .switch-glow { left:79px; background:rgba(180,200,255,0.1); box-shadow:0 0 30px 8px rgba(140,160,255,0.2); }

/* rays */
.switch-rays {
  position:absolute; top:50%; left:18px;
  transform:translateY(-50%);
  width:44px; height:44px;
  transition: opacity 0.6s ease, transform 1.2s cubic-bezier(0.34,1.56,0.64,1);
}
body.dark  .switch-rays { opacity:0; transform:translateY(-50%) scale(0.5); }
body.light .switch-rays { opacity:1; transform:translateY(-50%) scale(1); }
.ray { position:absolute; top:50%; left:50%; width:3px; border-radius:2px; background:rgba(255,200,50,0.6); transform-origin:0 0; animation:rayPulse 2s ease-in-out infinite; }
@keyframes rayPulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

/* switch stars */
.switch-stars { position:absolute; inset:0; border-radius:34px; overflow:hidden; pointer-events:none; transition:opacity 0.8s ease; }
body.light .switch-stars { opacity:0; }
body.dark  .switch-stars { opacity:1; }
.s-star { position:absolute; border-radius:50%; background:#fff; animation:starTwinkle ease-in-out infinite; }

/* ── THUMB ── */
.switch-thumb {
  position:absolute; top:50%; width:54px; height:54px; border-radius:50%;
  transform:translateY(-50%);
  overflow:hidden;
  /* NO transition on left when dragging — JS controls it */
  transition: left 1.2s cubic-bezier(0.34,1.56,0.64,1),
              background 1.2s ease, box-shadow 1.2s ease;
  will-change: left;
}
.switch-thumb.dragging { transition: background 1.2s ease, box-shadow 1.2s ease; } /* remove left transition while dragging */

body.light .switch-thumb {
  left:7px;
  background:radial-gradient(circle at 40% 35%, #ffe566 0%, #ffb800 60%, #ff9500 100%);
  box-shadow: 0 0 20px rgba(255,180,0,0.7), 0 0 40px rgba(255,140,0,0.3), 0 4px 12px rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.5) inset;
}
body.dark .switch-thumb {
  left:79px;
  background:radial-gradient(circle at 40% 35%, #e8e8f8 0%, #c8c8e8 50%, #a8a8c8 100%);
  box-shadow: 0 0 16px rgba(180,200,255,0.4), 0 4px 12px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.3) inset;
}

.moon-mask {
  position:absolute; width:48px; height:48px; border-radius:50%;
  transition: transform 1.2s cubic-bezier(0.34,1.56,0.64,1), opacity 1.2s ease, background 1.2s ease;
}
body.light .moon-mask { top:-6px; left:-6px; background:#7ab8ff; opacity:0; transform:translate(0,0); }
body.dark  .moon-mask { top:-6px; left:-6px; background:#080818; opacity:1; transform:translate(14px,6px); }

.crater { position:absolute; border-radius:50%; background:rgba(0,0,0,0.08); transition:opacity 0.8s ease; }
body.light .crater { opacity:0; }
body.dark  .crater { opacity:1; }

.mode-text { font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; opacity:0.35; }
</style>
</head>
<body class="light">

<div class="clouds" id="clouds"></div>
<div class="stars"  id="stars"></div>

<div class="switch-label">Theme</div>

<div class="switch" id="switch" role="button" tabindex="0" aria-label="Toggle dark mode">
  <div class="switch-glow"></div>
  <div class="switch-rays" id="rays"></div>
  <div class="switch-stars" id="switchStars"></div>
  <div class="switch-thumb" id="thumb">
    <div class="moon-mask"></div>
    <div class="crater" style="width:10px;height:10px;top:14px;left:28px;"></div>
    <div class="crater" style="width:7px;height:7px;top:28px;left:18px;"></div>
    <div class="crater" style="width:5px;height:5px;top:22px;left:34px;"></div>
  </div>
</div>

<div class="mode-text" id="modeText">Light Mode</div>

<script>
const body     = document.body;
const sw       = document.getElementById('switch');
const thumb    = document.getElementById('thumb');
const modeText = document.getElementById('modeText');

let dark = false;

// ── Build rays ──
for (let i = 0; i < 8; i++) {
  const ray = document.createElement('div');
  ray.className = 'ray';
  const angle = (i / 8) * 360;
  const len = i % 2 === 0 ? 10 : 7;
  ray.style.cssText = `height:${len}px;transform:rotate(${angle}deg) translate(-50%,-28px);animation-delay:${(i/8)*2}s;`;
  document.getElementById('rays').appendChild(ray);
}

// ── Build clouds ──
[{w:160,h:40,top:'20%',delay:'0s',dur:'28s'},{w:120,h:32,top:'35%',delay:'8s',dur:'22s'},{w:200,h:48,top:'55%',delay:'14s',dur:'32s'},{w:100,h:28,top:'70%',delay:'4s',dur:'20s'}].forEach(d => {
  const c = document.createElement('div');
  c.className = 'cloud';
  c.style.cssText = `width:${d.w}px;height:${d.h}px;top:${d.top};left:-${d.w}px;animation-duration:${d.dur};animation-delay:${d.delay};`;
  c.innerHTML = `<div style="width:${d.w*.6}px;height:${d.h*1.4}px;top:-${d.h*.5}px;left:${d.w*.2}px"></div><div style="width:${d.w*.4}px;height:${d.h*1.2}px;top:-${d.h*.3}px;left:${d.w*.5}px"></div>`;
  document.getElementById('clouds').appendChild(c);
});

// ── Build bg stars ──
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random()*2.5+0.5;
  s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;`;
  document.getElementById('stars').appendChild(s);
}

// ── Build switch stars ──
for (let i = 0; i < 8; i++) {
  const s = document.createElement('div');
  s.className = 's-star';
  const size = Math.random()*2+1;
  s.style.cssText = `width:${size}px;height:${size}px;top:${10+Math.random()*80}%;left:${55+Math.random()*40}%;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*2}s;`;
  document.getElementById('switchStars').appendChild(s);
}

// ── Toggle function ──
function setDark(val) {
  dark = val;
  body.className = dark ? 'dark' : 'light';
  modeText.textContent = dark ? 'Dark Mode' : 'Light Mode';
}

// ── DRAG LOGIC ──
const THUMB_MIN = 7;    // left pos in light
const THUMB_MAX = 79;   // left pos in dark
const TRACK_W   = 140;
const THUMB_W   = 54;
const DRAG_THRESHOLD = 4; // px before we consider it a drag

let pointerDown = false;
let isDragging  = false;
let startX      = 0;
let startLeft   = 0;
let didDrag     = false;

sw.addEventListener('pointerdown', e => {
  e.preventDefault();
  sw.setPointerCapture(e.pointerId);
  pointerDown = true;
  isDragging  = false;
  didDrag     = false;
  startX      = e.clientX;
  startLeft   = dark ? THUMB_MAX : THUMB_MIN;
});

sw.addEventListener('pointermove', e => {
  if (!pointerDown) return;
  const dx = e.clientX - startX;

  if (!isDragging && Math.abs(dx) > DRAG_THRESHOLD) {
    isDragging = true;
    didDrag    = true;
    thumb.classList.add('dragging');
  }

  if (isDragging) {
    let newLeft = Math.max(THUMB_MIN, Math.min(THUMB_MAX, startLeft + dx));
    thumb.style.left = newLeft + 'px';
  }
});

sw.addEventListener('pointerup', e => {
  if (!pointerDown) return;
  pointerDown = false;
  thumb.classList.remove('dragging');

  if (isDragging) {
    // Snap: if passed midpoint → toggle
    const currentLeft = parseFloat(thumb.style.left) || startLeft;
    const mid = (THUMB_MIN + THUMB_MAX) / 2;
    setDark(currentLeft >= mid);
    // Remove inline left — let CSS take over
    thumb.style.left = '';
  } else if (!didDrag) {
    // Pure tap
    setDark(!dark);
  }

  isDragging = false;
});

sw.addEventListener('pointercancel', () => {
  pointerDown = false;
  isDragging  = false;
  thumb.classList.remove('dragging');
  thumb.style.left = '';
});

// Keyboard
sw.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setDark(!dark); }
});
</script>
</body>
</html>
