<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Glass Navbar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  background: #060a14;
  overflow-x: hidden;
}

/* ── BACKGROUND ── */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(14,90,200,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 70%, rgba(0,180,160,0.22) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 55% 20%, rgba(80,40,200,0.18) 0%, transparent 50%),
    #060a14;
}

/* Caustic light ripples on background */
.caustics {
  position: fixed; inset: 0; z-index: 0;
  opacity: 0.07;
  background-image:
    radial-gradient(ellipse 120px 40px at 20% 40%, rgba(255,255,255,1) 0%, transparent 100%),
    radial-gradient(ellipse 80px 30px at 60% 60%, rgba(255,255,255,1) 0%, transparent 100%),
    radial-gradient(ellipse 100px 35px at 80% 25%, rgba(255,255,255,1) 0%, transparent 100%),
    radial-gradient(ellipse 60px 25px at 40% 75%, rgba(255,255,255,1) 0%, transparent 100%);
  animation: causticShift 8s ease-in-out infinite alternate;
}
@keyframes causticShift {
  from { transform: scale(1) translate(0,0); opacity: 0.07; }
  to   { transform: scale(1.08) translate(20px, 10px); opacity: 0.12; }
}

/* Underwater light beams */
.beams {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
}
.beam {
  position: absolute;
  top: -20%;
  width: 2px;
  height: 120vh;
  background: linear-gradient(180deg, rgba(100,180,255,0.15) 0%, transparent 80%);
  transform-origin: top center;
  animation: beamSway ease-in-out infinite alternate;
  filter: blur(3px);
}

@keyframes beamSway {
  from { transform: rotate(var(--r1)); opacity: var(--op1); }
  to   { transform: rotate(var(--r2)); opacity: var(--op2); }
}

/* ── NAVBAR WRAPPER ── */
.navbar-wrap {
  position: fixed;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  width: min(1000px, calc(100% - 28px));
  z-index: 100;
}

/* ── WATER GLASS NAVBAR ── */
.navbar {
  position: relative;
  display: flex; align-items: center;
  gap: 0;
  border-radius: 24px;
  overflow: hidden;
  transition: transform 0.1s ease;

  /* Water glass layers */
  background:
    linear-gradient(180deg,
      rgba(255,255,255,0.13) 0%,
      rgba(120,200,255,0.05) 30%,
      rgba(0,150,200,0.04) 70%,
      rgba(255,255,255,0.06) 100%
    );
  backdrop-filter: blur(36px) saturate(220%) brightness(1.08) hue-rotate(5deg);
  -webkit-backdrop-filter: blur(36px) saturate(220%) brightness(1.08) hue-rotate(5deg);

  border: 1px solid rgba(255,255,255,0.22);
  border-bottom: 1px solid rgba(255,255,255,0.1);

  box-shadow:
    /* top shine — water surface */
    0 1px 0 rgba(255,255,255,0.35) inset,
    /* left caustic */
    -1px 0 0 rgba(120,200,255,0.15) inset,
    /* right caustic */
    1px 0 0 rgba(120,200,255,0.1) inset,
    /* bottom depth */
    0 -1px 0 rgba(0,80,160,0.3) inset,
    /* outer glow */
    0 0 0 1px rgba(100,180,255,0.08),
    0 8px 32px rgba(0,30,80,0.5),
    0 24px 60px rgba(0,20,60,0.4),
    0 0 100px rgba(0,100,200,0.12);
}

/* Flowing water shimmer overlay */
.navbar::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    105deg,
    transparent 30%,
    rgba(255,255,255,0.07) 45%,
    rgba(180,230,255,0.1) 50%,
    rgba(255,255,255,0.07) 55%,
    transparent 70%
  );
  animation: waterShimmer 4s ease-in-out infinite;
  pointer-events: none;
  border-radius: inherit;
}
@keyframes waterShimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

/* Top specular — water surface refraction */
.navbar::after {
  content: '';
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.4) 20%,
    rgba(200,240,255,0.8) 50%,
    rgba(255,255,255,0.4) 80%,
    transparent 100%
  );
  pointer-events: none;
}

/* ── LOGO ── */
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px 11px 18px;
  text-decoration: none; flex-shrink: 0;
  position: relative; z-index: 1;
}

.logo-drop {
  width: 32px; height: 38px; position: relative;
}
.logo-drop svg { width: 100%; height: 100%; }

.logo-text {
  font-size: 15px; font-weight: 700;
  color: rgba(255,255,255,0.92);
  letter-spacing: -0.5px;
}
.logo-text span {
  background: linear-gradient(135deg, #60c8ff, #00e8c8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Dividers */
.vr {
  width: 1px; height: 26px; flex-shrink: 0;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.14), transparent);
}

/* ── LINKS ── */
.nav-links {
  display: flex; align-items: center;
  padding: 7px 8px; gap: 1px;
  flex: 1; justify-content: center;
  position: relative; z-index: 1;
}

.nav-link {
  position: relative;
  padding: 7px 14px;
  border-radius: 13px;
  font-size: 13.5px; font-weight: 500;
  color: rgba(255,255,255,0.52);
  text-decoration: none;
  transition: color 0.22s;
  white-space: nowrap;
}
.nav-link::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 13px;
  transition: background 0.22s, border 0.22s, box-shadow 0.22s;
}
.nav-link:hover { color: rgba(255,255,255,0.9); }
.nav-link:hover::before {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
}
.nav-link.active { color: rgba(255,255,255,0.95); }
.nav-link.active::before {
  background: linear-gradient(180deg, rgba(255,255,255,0.13) 0%, rgba(100,200,255,0.08) 100%);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.2) inset,
    0 2px 8px rgba(0,50,120,0.3),
    0 0 12px rgba(80,180,255,0.1);
}

.nav-dot {
  display: inline-block; width: 4px; height: 4px;
  background: #60c8ff; border-radius: 50%;
  margin-left: 5px; vertical-align: middle;
  box-shadow: 0 0 6px rgba(96,200,255,0.8);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

.nav-badge {
  display: inline-flex; align-items: center;
  margin-left: 5px; padding: 1.5px 7px;
  background: linear-gradient(135deg, rgba(0,200,180,0.35), rgba(0,150,255,0.35));
  border: 1px solid rgba(0,220,200,0.3);
  border-radius: 20px;
  font-size: 9px; font-weight: 700;
  color: rgba(0,240,220,0.9); letter-spacing: 0.5px;
  vertical-align: middle;
  backdrop-filter: blur(4px);
}

/* ── SEARCH ── */
.nav-search {
  padding: 7px 6px; position: relative; z-index: 1; flex-shrink: 0;
}
.search-inner { position: relative; display: flex; align-items: center; }
.search-ico {
  position: absolute; left: 10px;
  color: rgba(255,255,255,0.28); pointer-events: none;
  transition: color 0.2s;
}
.search-ico svg { width: 13px; height: 13px; display: block; }
.search-input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 7px 12px 7px 31px;
  color: rgba(255,255,255,0.9);
  font-size: 13px; font-family: 'Inter', sans-serif;
  width: 144px; outline: none;
  transition: width 0.35s cubic-bezier(0.4,0,0.2,1), border-color 0.2s, background 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset;
}
.search-input::placeholder { color: rgba(255,255,255,0.24); }
.search-input:focus {
  width: 190px;
  border-color: rgba(80,200,255,0.45);
  background: rgba(0,120,200,0.1);
  box-shadow: 0 0 0 3px rgba(80,200,255,0.1), 0 1px 0 rgba(255,255,255,0.08) inset;
}
.search-input:focus + .search-ico,
.search-inner:focus-within .search-ico { color: rgba(80,200,255,0.7); }

/* ── ACTIONS ── */
.nav-actions {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 16px 7px 6px;
  position: relative; z-index: 1; flex-shrink: 0;
}

/* Theme toggle — water drop */
.toggle-wrap {
  display: flex; align-items: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 3px;
  gap: 2px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset;
}
.toggle-opt {
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer; font-size: 13px;
  transition: background 0.2s, transform 0.15s;
  user-select: none;
}
.toggle-opt.on {
  background: rgba(80,200,255,0.2);
  box-shadow: 0 0 8px rgba(80,200,255,0.3);
  transform: scale(1.08);
}

.btn-ico {
  width: 34px; height: 34px; border-radius: 11px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.55);
  display: grid; place-items: center; cursor: pointer;
  font-size: 14px;
  transition: background 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
  position: relative;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset;
  flex-shrink: 0;
}
.btn-ico svg { width: 14px; height: 14px; display: block; }
.btn-ico:hover {
  background: rgba(255,255,255,0.11);
  color: rgba(255,255,255,0.9);
  transform: translateY(-1px);
  box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 12px rgba(0,50,120,0.35);
}
.notif-ring {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #f43f5e;
  border: 1.5px solid rgba(6,10,20,0.8);
  box-shadow: 0 0 0 0 rgba(244,63,94,0.5);
  animation: notifRing 2.2s ease-out infinite;
}
@keyframes notifRing {
  0%   { box-shadow: 0 0 0 0 rgba(244,63,94,0.6); }
  60%  { box-shadow: 0 0 0 5px rgba(244,63,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); }
}

/* Status indicator */
.status-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  background: rgba(0,220,130,0.08);
  border: 1px solid rgba(0,220,130,0.2);
  border-radius: 20px;
  font-size: 11px; font-weight: 500;
  color: rgba(0,220,130,0.8);
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(0,220,130,0.08) inset;
  flex-shrink: 0;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #00dc82;
  box-shadow: 0 0 6px rgba(0,220,130,0.8);
  animation: statusPulse 2s ease-in-out infinite;
}
@keyframes statusPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* CTA */
.btn-cta {
  position: relative; overflow: hidden; isolation: isolate;
  padding: 7px 17px; border-radius: 13px; border: none;
  cursor: pointer;
  font-size: 13px; font-weight: 600;
  font-family: 'Inter', sans-serif; color: #fff;
  background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #0369a1 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.28) inset,
    0 -1px 0 rgba(0,0,0,0.2) inset,
    0 4px 14px rgba(14,165,233,0.35),
    0 1px 3px rgba(0,0,0,0.25);
  transition: transform 0.15s, box-shadow 0.2s;
  flex-shrink: 0;
}
.btn-cta::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, transparent 55%);
  border-radius: inherit;
  pointer-events: none;
}
/* Water ripple on hover */
.btn-cta::after {
  content: '';
  position: absolute;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  transition: transform 0.5s ease, opacity 0.5s;
}
.btn-cta:hover {
  transform: translateY(-1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.3) inset,
    0 6px 22px rgba(14,165,233,0.5),
    0 2px 6px rgba(0,0,0,0.2);
}
.btn-cta:active::after { transform: translate(-50%,-50%) scale(2.5); opacity: 0; transition: 0s; }

/* Avatar with water ring */
.nav-avatar {
  position: relative; flex-shrink: 0;
}
.avatar-img {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #00dc82 100%);
  border: 1.5px solid rgba(255,255,255,0.22);
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #fff;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(14,165,233,0.35);
}
.avatar-img:hover { transform: scale(1.1); box-shadow: 0 4px 14px rgba(14,165,233,0.5); }
.avatar-ring {
  position: absolute; inset: -4px;
  border-radius: 50%;
  border: 1.5px solid rgba(14,165,233,0.35);
  animation: avatarRing 3s ease-in-out infinite;
}
@keyframes avatarRing {
  0%,100% { transform: scale(1); opacity: 0.5; }
  50%      { transform: scale(1.12); opacity: 0.15; }
}

/* ── PAGE CONTENT ── */
.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 120px 24px 60px;
  gap: 18px; text-align: center;
}
.page-tag {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 16px;
  background: rgba(14,165,233,0.1);
  border: 1px solid rgba(14,165,233,0.22);
  border-radius: 20px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(14,165,233,0.85);
}
.page h1 {
  font-size: clamp(2.6rem, 5.5vw, 4.2rem);
  font-weight: 300; letter-spacing: -2px; line-height: 1.08;
  color: rgba(255,255,255,0.9);
}
.page h1 b { font-weight: 700; }
.page h1 em {
  font-style: normal;
  background: linear-gradient(135deg, #60c8ff, #00e8c8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page p {
  color: rgba(255,255,255,0.35);
  font-size: 15px; max-width: 380px; line-height: 1.7;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="caustics"></div>
<div class="beams" id="beams"></div>

<div class="navbar-wrap">
  <nav class="navbar" id="navbar">

    <!-- Logo -->
    <a href="#" class="nav-logo">
      <div class="logo-drop">
        <svg viewBox="0 0 32 38" fill="none">
          <defs>
            <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#60c8ff"/>
              <stop offset="100%" stop-color="#00e8c8"/>
            </linearGradient>
            <linearGradient id="dropShine" x1="0" y1="0" x2="0.5" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
          </defs>
          <path d="M16 2 C16 2, 28 16, 28 24 C28 31, 22.6 36, 16 36 C9.4 36, 4 31, 4 24 C4 16, 16 2, 16 2Z" fill="url(#dropGrad)" opacity="0.9"/>
          <path d="M16 6 C16 6, 24 17, 24 23 C24 26, 22 28, 20 27" fill="none" stroke="url(#dropShine)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        </svg>
      </div>
      <span class="logo-text"><span>aqua</span>UI</span>
    </a>

    <div class="vr"></div>

    <!-- Links -->
    <div class="nav-links">
      <a href="#" class="nav-link active">Home <span class="nav-dot"></span></a>
      <a href="#" class="nav-link">Components</a>
      <a href="#" class="nav-link">Templates</a>
      <a href="#" class="nav-link">Docs <span class="nav-badge">v2</span></a>
      <a href="#" class="nav-link">Showcase</a>
      <a href="#" class="nav-link">Pricing</a>
    </div>

    <div class="vr"></div>

    <!-- Search -->
    <div class="nav-search">
      <div class="search-inner">
        <input class="search-input" type="text" placeholder="Search components…" aria-label="Search">
        <span class="search-ico">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="6.5" cy="6.5" r="4.5"/>
            <line x1="10" y1="10" x2="14" y2="14"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="vr"></div>

    <!-- Actions -->
    <div class="nav-actions">

      <!-- Theme toggle -->
      <div class="toggle-wrap">
        <div class="toggle-opt on" title="Light">☀️</div>
        <div class="toggle-opt" title="Dark">🌙</div>
      </div>

      <!-- Bookmark -->
      <button class="btn-ico" title="Bookmarks">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 2h10v13l-5-3-5 3V2z"/>
        </svg>
      </button>

      <!-- Notifications -->
      <button class="btn-ico" title="Notifications">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M8 2a4 4 0 0 1 4 4v2.5l1.5 2.5H2.5L4 8.5V6a4 4 0 0 1 4-4z"/>
          <path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/>
        </svg>
        <span class="notif-ring"></span>
      </button>

      <!-- Status -->
      <div class="status-pill">
        <span class="status-dot"></span>
        Online
      </div>

      <button class="btn-cta">Get Started</button>

      <!-- Avatar -->
      <div class="nav-avatar">
        <div class="avatar-ring"></div>
        <div class="avatar-img">A</div>
      </div>

    </div>
  </nav>
</div>

<!-- Page hero -->
<div class="page">
  <span class="page-tag">💧 CSS Snippet</span>
  <h1><b>Water</b> <em>Glass</em><br>Navbar</h1>
  <p>Pure CSS liquid glass — flowing shimmer, caustic light, and real water surface physics.</p>
</div>

<script>
// Light beams
const beamsEl = document.getElementById('beams');
const beamCount = 8;
for (let i = 0; i < beamCount; i++) {
  const b = document.createElement('div');
  b.className = 'beam';
  const left = 5 + (i / beamCount) * 90;
  const r1 = -8 + Math.random() * 6;
  const r2 = r1 + 6 + Math.random() * 6;
  const dur = 6 + Math.random() * 8;
  const op1 = 0.3 + Math.random() * 0.5;
  const op2 = 0.1 + Math.random() * 0.3;
  b.style.cssText = `
    left: ${left}%;
    --r1: ${r1}deg;
    --r2: ${r2}deg;
    --op1: ${op1};
    --op2: ${op2};
    animation-duration: ${dur}s;
    animation-delay: ${-Math.random() * dur}s;
    height: ${100 + Math.random() * 40}vh;
  `;
  beamsEl.appendChild(b);
}

// Mouse parallax
const navbar = document.getElementById('navbar');
document.addEventListener('mousemove', e => {
  const x = (e.clientX / window.innerWidth - 0.5) * 8;
  const y = (e.clientY / window.innerHeight - 0.5) * 4;
  navbar.style.transform = `perspective(1400px) rotateX(${-y * 0.35}deg) rotateY(${x * 0.25}deg)`;
});
document.addEventListener('mouseleave', () => {
  navbar.style.transform = 'perspective(1400px) rotateX(0) rotateY(0)';
});

// Theme toggle
document.querySelectorAll('.toggle-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.toggle-opt').forEach(o => o.classList.remove('on'));
    opt.classList.add('on');
  });
});

// Active link
document.querySelectorAll('.nav-link').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
  });
});
</script>
</body>
</html>
