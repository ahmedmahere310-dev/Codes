<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Audio Knob</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%; height: 100%;
  font-family: 'Inter', sans-serif;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  overflow: hidden;
}

/* ── RESPONSIVE SCALE ── */
.stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(24px, 6vw, 80px);
  padding: clamp(16px, 4vw, 48px);
  width: 100%; height: 100%;
}

.knob-scene {
  display: flex; flex-direction: column;
  align-items: center;
  gap: clamp(8px, 1.5vw, 16px);
  /* Each knob takes equal space up to a max */
  flex: 1;
  max-width: min(45vw, 45vh, 280px);
}

.knob-outer {
  position: relative;
  /* Square, fills the scene width */
  width: 100%;
  padding-bottom: 100%; /* 1:1 ratio */
  touch-action: none;
}

/* SVG & body absolutely fill the outer */
.knob-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: visible;
}

/* knob-body uses % so it scales */
.knob-body {
  position: absolute;
  inset: 11%;          /* ~20px on 180px */
  border-radius: 50%;
  cursor: grab;
  touch-action: none;
  transition: box-shadow 0.15s ease;
}

.knob-body.dark {
  background:
    radial-gradient(ellipse 55% 38% at 34% 28%, rgba(255,255,255,0.16) 0%, transparent 55%),
    radial-gradient(circle at 50% 50%, #2a2a30 0%, #18181c 55%, #0e0e11 100%);
  border: 1px solid rgba(255,255,255,0.1);
  border-top: 1px solid rgba(255,255,255,0.2);
  box-shadow:
    0 2px 0 rgba(255,255,255,0.08) inset,
    0 -2px 0 rgba(0,0,0,0.5) inset,
    0 8px 24px rgba(0,0,0,0.8),
    0 2px 8px rgba(0,0,0,0.5);
}
.knob-body.dark.active {
  cursor: grabbing;
  box-shadow:
    0 2px 0 rgba(255,255,255,0.08) inset,
    0 -2px 0 rgba(0,0,0,0.5) inset,
    0 4px 16px rgba(0,0,0,0.7),
    0 0 28px rgba(255,140,0,0.18);
}

.knob-body.light {
  background:
    radial-gradient(ellipse 55% 38% at 34% 28%, rgba(255,255,255,0.9) 0%, transparent 55%),
    radial-gradient(circle at 50% 50%, #e8e8ec 0%, #d0d0d8 55%, #b8b8c2 100%);
  border: 1px solid rgba(0,0,0,0.12);
  border-top: 1px solid rgba(255,255,255,0.95);
  box-shadow:
    0 2px 0 rgba(255,255,255,0.8) inset,
    0 -2px 0 rgba(0,0,0,0.15) inset,
    0 8px 24px rgba(0,0,0,0.35),
    0 2px 8px rgba(0,0,0,0.2);
}
.knob-body.light.active {
  cursor: grabbing;
  box-shadow:
    0 2px 0 rgba(255,255,255,0.8) inset,
    0 -2px 0 rgba(0,0,0,0.15) inset,
    0 4px 16px rgba(0,0,0,0.25),
    0 0 28px rgba(255,140,0,0.2);
}

/* Knurl */
.knob-knurl {
  position: absolute;
  inset: 7%; border-radius: 50%;
  pointer-events: none;
}
.knob-knurl.dark  { border: 1px solid rgba(255,255,255,0.05); }
.knob-knurl.light { border: 1px solid rgba(0,0,0,0.08); }

/* Indicator */
.knob-indicator {
  position: absolute; inset: 0;
  border-radius: 50%;
  pointer-events: none;
  transform-origin: center;
}
.indicator-line {
  position: absolute;
  top: 7%; left: 50%;
  transform: translateX(-50%);
  width: 10%; height: 18%;
  min-width: 3px; min-height: 8px;
  border-radius: 2px;
}
.dark  .indicator-line { background:#ff8c00; box-shadow:0 0 8px rgba(255,140,0,1),0 0 16px rgba(255,140,0,0.5); }
.light .indicator-line { background:#c05000; box-shadow:0 0 6px rgba(180,70,0,0.7); }

/* Cap */
.knob-cap {
  position: absolute;
  inset: 20%; border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none; gap: 2px;
}
.knob-cap.dark  { background:radial-gradient(circle,#1e1e23 0%,#141417 100%); border:1px solid rgba(255,255,255,0.05); }
.knob-cap.light { background:radial-gradient(circle,#dcdce4 0%,#c8c8d2 100%); border:1px solid rgba(255,255,255,0.7); }

.knob-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(14px, 3.5vw, 22px);
  font-weight: 700; line-height: 1; letter-spacing: -1px;
}
.dark  .knob-val { color:#ff8c00; text-shadow:0 0 10px rgba(255,140,0,0.7); }
.light .knob-val { color:#c05000; }

.knob-unit {
  font-size: clamp(7px, 1.2vw, 10px);
  font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
}
.dark  .knob-unit { color:rgba(255,255,255,0.25); }
.light .knob-unit { color:rgba(0,0,0,0.35); }

/* Label */
.knob-label {
  font-size: clamp(9px, 1.5vw, 12px);
  font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
}
.knob-label.dark  { color:rgba(255,255,255,0.3); }
.knob-label.light { color:rgba(0,0,0,0.4); }

/* Ripple */
.knob-ripple {
  position: absolute; inset: 10%;
  border-radius: 50%; pointer-events: none;
  border: 2px solid rgba(255,140,0,0);
}
.knob-ripple.fire { animation: ripplePop 0.5s ease-out forwards; }
@keyframes ripplePop {
  0%   { border-color:rgba(255,140,0,0.8); transform:scale(1); }
  100% { border-color:rgba(255,140,0,0);   transform:scale(1.35); }
}

/* Reset badge */
.reset-badge {
  position: absolute; top: -4px; right: -4px;
  width: clamp(18px, 3vw, 24px); height: clamp(18px, 3vw, 24px);
  border-radius: 50%; background:#ff8c00;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(10px, 1.8vw, 14px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
  box-shadow: 0 2px 8px rgba(255,140,0,0.5);
  z-index: 10; cursor: pointer;
}
.knob-outer:hover .reset-badge { opacity:1; pointer-events:all; }
</style>
</head>
<body>

<div class="stage">

  <!-- DARK -->
  <div class="knob-scene">
    <div class="knob-outer" id="knob-dark">
      <svg class="knob-svg" viewBox="0 0 180 180">
        <g id="ticks-dark"></g>
        <circle id="arcBg-dark" cx="90" cy="90" r="82" fill="none"
          stroke="rgba(255,255,255,0.05)" stroke-width="3" stroke-linecap="round"/>
        <circle id="arcFg-dark" cx="90" cy="90" r="82" fill="none"
          stroke="#ff8c00" stroke-width="3" stroke-linecap="round"
          style="filter:drop-shadow(0 0 5px rgba(255,140,0,0.8))"/>
      </svg>
      <div class="knob-body dark" id="body-dark">
        <div class="knob-knurl dark"></div>
        <div class="knob-indicator" id="ind-dark">
          <div class="indicator-line"></div>
        </div>
        <div class="knob-cap dark">
          <div class="knob-val" id="val-dark">75</div>
          <div class="knob-unit">Volume</div>
        </div>
      </div>
      <div class="knob-ripple" id="ripple-dark"></div>
      <div class="reset-badge" id="reset-dark">↺</div>
    </div>
    <div class="knob-label dark">Dark Mode</div>
  </div>

  <!-- LIGHT -->
  <div class="knob-scene">
    <div class="knob-outer" id="knob-light">
      <svg class="knob-svg" viewBox="0 0 180 180">
        <g id="ticks-light"></g>
        <circle id="arcBg-light" cx="90" cy="90" r="82" fill="none"
          stroke="rgba(0,0,0,0.08)" stroke-width="3" stroke-linecap="round"/>
        <circle id="arcFg-light" cx="90" cy="90" r="82" fill="none"
          stroke="#e06000" stroke-width="3" stroke-linecap="round"
          style="filter:drop-shadow(0 0 4px rgba(200,80,0,0.5))"/>
      </svg>
      <div class="knob-body light" id="body-light">
        <div class="knob-knurl light"></div>
        <div class="knob-indicator" id="ind-light">
          <div class="indicator-line"></div>
        </div>
        <div class="knob-cap light">
          <div class="knob-val" id="val-light">75</div>
          <div class="knob-unit">Volume</div>
        </div>
      </div>
      <div class="knob-ripple" id="ripple-light"></div>
      <div class="reset-badge" id="reset-light">↺</div>
    </div>
    <div class="knob-label light">Light Mode</div>
  </div>

</div>

<script>
const R=82, CX=90, CY=90, CIRC=2*Math.PI*R, SPAN=270, START=-225;

function buildTicks(gId, c1, c2) {
  const g = document.getElementById(gId);
  for (let i=0; i<=41; i++) {
    const deg = START + (i/41)*SPAN;
    const rad = deg*Math.PI/180;
    const major = i%8===0;
    const r1 = major?74:78;
    const x1=CX+r1*Math.cos(rad), y1=CY+r1*Math.sin(rad);
    const x2=CX+86*Math.cos(rad), y2=CY+86*Math.sin(rad);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke', major?c1:c2);
    l.setAttribute('stroke-width', major?'2':'1');
    l.setAttribute('stroke-linecap','round');
    g.appendChild(l);
  }
}
buildTicks('ticks-dark',  'rgba(255,255,255,0.25)','rgba(255,255,255,0.08)');
buildTicks('ticks-light', 'rgba(0,0,0,0.28)',      'rgba(0,0,0,0.09)');

function setArc(fgId, bgId, pct) {
  const total=(SPAN/360)*CIRC;
  const offset=-((360-SPAN)/2/360)*CIRC+CIRC*0.25;
  const tr=`rotate(${START} ${CX} ${CY})`;
  const fg=document.getElementById(fgId);
  const bg=document.getElementById(bgId);
  fg.setAttribute('stroke-dasharray', `${pct*total} ${CIRC}`);
  fg.setAttribute('stroke-dashoffset', -offset);
  fg.setAttribute('transform', tr);
  bg.setAttribute('stroke-dasharray', `${total} ${CIRC}`);
  bg.setAttribute('stroke-dashoffset', -offset);
  bg.setAttribute('transform', tr);
}

function makeKnob({ bodyId, indId, valId, arcFgId, arcBgId, rippleId, resetId, def=75 }) {
  let val = def;
  const body   = document.getElementById(bodyId);
  const ind    = document.getElementById(indId);
  const valEl  = document.getElementById(valId);
  const ripple = document.getElementById(rippleId);
  const resetBtn = document.getElementById(resetId);

  function update(v) {
    val = Math.max(0, Math.min(100, v));
    ind.style.transform = `rotate(${START + (val/100)*SPAN}deg)`;
    valEl.textContent   = Math.round(val);
    setArc(arcFgId, arcBgId, val/100);
  }

  function fireRipple() {
    ripple.classList.remove('fire');
    void ripple.offsetWidth;
    ripple.classList.add('fire');
  }

  resetBtn.addEventListener('click', e => { e.stopPropagation(); update(def); fireRipple(); });

  let dragging=false, startY=0, startVal=0, longTimer=null, lastTap=0;

  body.addEventListener('pointerdown', e => {
    e.preventDefault();
    body.setPointerCapture(e.pointerId);
    dragging=true; startY=e.clientY; startVal=val;
    body.classList.add('active');

    longTimer = setTimeout(() => { update(def); fireRipple(); }, 600);

    const now=Date.now();
    if (now-lastTap < 300) { update(def); fireRipple(); }
    lastTap=now;
  });

  body.addEventListener('pointermove', e => {
    if (!dragging) return;
    e.preventDefault();
    clearTimeout(longTimer);
    update(startVal + (startY - e.clientY) * 0.55);
  });

  body.addEventListener('pointerup', e => {
    e.preventDefault();
    clearTimeout(longTimer);
    dragging=false;
    body.classList.remove('active');
  });

  body.addEventListener('pointercancel', () => {
    clearTimeout(longTimer);
    dragging=false;
    body.classList.remove('active');
  });

  body.addEventListener('wheel', e => {
    e.preventDefault();
    update(val - e.deltaY * 0.18);
  }, { passive:false });

  update(def);
}

makeKnob({ bodyId:'body-dark',  indId:'ind-dark',  valId:'val-dark',
           arcFgId:'arcFg-dark',  arcBgId:'arcBg-dark',
           rippleId:'ripple-dark',  resetId:'reset-dark',  def:75 });

makeKnob({ bodyId:'body-light', indId:'ind-light', valId:'val-light',
           arcFgId:'arcFg-light', arcBgId:'arcBg-light',
           rippleId:'ripple-light', resetId:'reset-light', def:75 });
</script>
</body>
</html>
